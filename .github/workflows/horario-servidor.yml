name: Horario Servidor OnlyOffice

on:
  schedule:
    - cron: '0 3 * * *'    # 00:00 Argentina (UTC-3) -> apagar
    - cron: '50 10 * * *'  # 07:50 Argentina (UTC-3) -> prender (10 min de margen para que este listo a las 08:00)
  workflow_dispatch:
    inputs:
      action:
        description: 'Accion manual'
        required: true
        type: choice
        options:
          - stop
          - start

jobs:
  control-server:
    runs-on: ubuntu-latest
    steps:
      - name: Determinar accion
        id: determine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "action=stop" >> "$GITHUB_OUTPUT"
          else
            echo "action=start" >> "$GITHUB_OUTPUT"
          fi

      # Clouding puede aceptar el pedido (HTTP 202) y no ejecutarlo -- pasó
      # el 30/09/26 (el cron de arranque de las 07:50 corrió "bien" pero el
      # servidor siguió apagado). Este paso no confía en el 202: pide la
      # accion y espera hasta 5 minutos verificando el estado REAL de la VM
      # en Clouding, con un reintento antes de fallar.
      #
      # Encontrado 01/10/26: ni siquiera alcanza con que la VM esté "Active"
      # -- eso solo dice que la máquina prendió, no que el servicio de
      # OnlyOffice adentro ya terminó de bootear y está respondiendo. El
      # 30/09 esto dio "falso positivo": la VM llegó a Active, el job cerró
      # en verde, pero el servicio real tardó más y quedó caído para el
      # usuario igual. Por eso, solo para "start", se agrega un segundo
      # chequeo: además de la VM activa, esperar a que el healthcheck HTTP
      # responda 200 de verdad antes de dar el arranque por terminado.
      - name: Ejecutar y verificar en Clouding
        env:
          API_KEY: ${{ secrets.CLOUDING_API_KEY }}
          SERVER_ID: ${{ secrets.CLOUDING_SERVER_ID }}
          ACTION: ${{ steps.determine.outputs.action }}
        run: |
          ESTADO_ESPERADO="Active"
          [ "$ACTION" = "stop" ] && ESTADO_ESPERADO="Stopped"

          pedir_accion() {
            RESPUESTA=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              -H "X-API-KEY: $API_KEY" \
              "https://api.clouding.io/v1/servers/$SERVER_ID/$ACTION" \
              -w "\nHTTP_STATUS:%{http_code}\n")
            echo "$RESPUESTA"
            echo "$RESPUESTA" | grep -q "HTTP_STATUS:202" || { echo "Clouding no aceptó el pedido de $ACTION"; exit 1; }
          }

          estado_actual() {
            curl -s -H "X-API-KEY: $API_KEY" "https://api.clouding.io/v1/servers/$SERVER_ID" \
              | grep -o '"status":"[^"]*"' | cut -d'"' -f4
          }

          esperar_estado() {
            for i in $(seq 1 20); do
              sleep 15
              ESTADO=$(estado_actual)
              echo "intento $i: $ESTADO"
              [ "$ESTADO" = "$ESTADO_ESPERADO" ] && return 0
            done
            return 1
          }

          esperar_servicio_onlyoffice() {
            for i in $(seq 1 20); do
              sleep 15
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://onlyoffice.notarial.lat/healthcheck || echo "000")
              echo "healthcheck intento $i: HTTP $CODE"
              [ "$CODE" = "200" ] && return 0
            done
            return 1
          }

          verificacion_completa() {
            esperar_estado || return 1
            if [ "$ACTION" = "start" ]; then
              esperar_servicio_onlyoffice || { echo "La VM llegó a Active pero OnlyOffice no respondió"; return 1; }
            fi
            return 0
          }

          pedir_accion

          if verificacion_completa; then
            echo "OK: $ACTION completado y verificado de verdad"
            exit 0
          fi

          echo "No se completó $ACTION correctamente -- reintentando una vez"
          pedir_accion

          if verificacion_completa; then
            echo "OK tras reintento: $ACTION completado y verificado de verdad"
            exit 0
          fi

          echo "FALLO: $ACTION no se completó después de reintentar"
          exit 1

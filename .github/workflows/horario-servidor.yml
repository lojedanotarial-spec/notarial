name: Horario Servidor OnlyOffice

on:
  schedule:
    - cron: '0 3 * * *'    # 00:00 Argentina (UTC-3) -> apagar
    - cron: '50 10 * * *'  # 07:50 Argentina (UTC-3) -> prender (10 min de margen para que este listo a las 08:00)
  workflow_dispatch:
    inputs:
      action:
        description: 'Accion manual'
        required: true
        type: choice
        options:
          - stop
          - start

jobs:
  control-server:
    runs-on: ubuntu-latest
    steps:
      - name: Determinar accion
        id: determine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "action=stop" >> "$GITHUB_OUTPUT"
          else
            echo "action=start" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar accion en Clouding
        run: |
          RESPUESTA=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-KEY: ${{ secrets.CLOUDING_API_KEY }}" \
            "https://api.clouding.io/v1/servers/${{ secrets.CLOUDING_SERVER_ID }}/${{ steps.determine.outputs.action }}" \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$RESPUESTA"
          echo "$RESPUESTA" | grep -q "HTTP_STATUS:202" || (echo "Fallo la accion" && exit 1)
